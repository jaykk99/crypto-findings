name: Parser and redaction tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight test runner
        run: python -m pip install pytest
      - name: Run offline parser and persistence tests
        env:
          CRYPTO_FINDINGS_DB: '${{ runner.temp }}/crypto-findings-ci.sqlite3'
        run: python -m pytest -q tests/test_parser.py tests/test_db_recon.py tests/test_safe_http.py
