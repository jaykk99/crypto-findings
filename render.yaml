services:
  - type: web
    name: crypto-findings
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CRYPTO_FINDINGS_CODE
        sync: false
      - key: RECON_ACCESS_CODE
        sync: false
